# The claims file of the diff gate (docs/plan/core-ir.md, section 2.5, stage G7).
#
# Each claim says what the `ir` pipeline must do with the repro of a finding of
# `docs/ir.md` section 10. `crates/weft-gate/tests/claims.rs` checks the
# claims (`cargo test -p weft-gate --test claims`). A claim is on when its
# `stage` is in `done` and each group of its `group` set is on in the `ir`
# pipeline (`Options::ir_groups`). An `interp` claim needs only its stage.
# Before stage F1 no group is on, so each claim is off; the test then checks
# that each repro exists. From stage F1 on, the test also checks that `group`
# is the union of the groups that `irbuild/scope.rs` computes for the repros.
# A failure changes the code or the verdict (docs/ir.md section 10).
#
# [[claim]]
# finding = "M3"          # the finding id, as the ledger writes it
# kind = "unsound"        # unsound: the ir pipeline must reject each repro
#                         # fp: a false positive; the ir pipeline must accept each repro
#                         # sound: a correct program (a control, or a repro that a fix
#                         #   made correct); the ir pipeline must accept it
#                         # interp: the oracle of the IR engine must not fault (from
#                         #   the IR oracle cache)
#                         # speed: the ir pipeline must check each repro in `limit_ms`
#                         #   (a release build; a debug build gets 20 times the limit)
# verdict = "construction"  # construction, one-rule, stays, partly or none (docs/ir.md 10)
# group = "AD"            # the construct groups that the repros use (group A included)
# stage = "F15"           # the stage that turns the claim on (docs/ir.md 10.4, the
#                         # plan text of the stage, or the stage of the last group)
# repro = ["tests/gate/probes/ir/work/machine/m8_abort_value_into_body.wf"]
# code = "W0301"          # optional. unsound: the rejection must have this code.
#                         # fp and sound with a line: no error with this code there
# line = 11               # optional. unsound: an error at this line. fp and sound:
#                         # no error at this line (other lines can have errors)
# exact = ["W0601"]       # optional, unsound only: exactly these error codes
# limit_ms = 1000         # speed only
# note = "..."            # the shape, or why the claim has its kind
#
# How stage G7 made the claims. One claim for each row of docs/ir.md 10.4 and
# for each finding of 10.2 (and its controls). Then one claim for each finding
# of `docs/plan/core-ir-inputs/findings.py` with the verdict "construction" or
# "one rule" that has a repro among the hand probes: the repro paths of the
# round reports, of the stage results (V001 to V138, numbered as in
# root_causes.md Appendix B) and of the file names, and the `open-old` entries
# of the ledger. A repro of an unsound finding is in a claim if the old pipeline
# rejects it or the `ast` oracle faults on it (stage G6 baseline and oracle
# cache). A repro of a false positive is in a claim if the old pipeline accepts
# it and the oracle does not fault, or with the `line` of the false positive.
# A finding with no claim has a comment line `# ID: reason` at the end of the
# file. The `group` sets come from a syntactic preview of the scope rules of
# plan section 2.6; stage F1 checks them against `irbuild/scope.rs`. Claims of
# one finding with different group sets are separate claims.
#
# A stage that turns claims on adds its id to `done` (rule 5 of the plan: a
# follow-up stage `F8.1` is a stage id too).

done = ["S00", "G1", "G2", "G3", "G4", "G5", "G6", "G7", "I5", "F7", "F8"]


