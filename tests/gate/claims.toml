kind = "sound"
verdict = "construction"
group = "AC"
stage = "F11"
repro = ["tests/gate/probes/fixes/b12/late_once_capture.wf"]
note = "A closure captures `c` before `c` gets a once closure: the capture is `Kept` (one cell), the call runs the new value once; a correct program, the ir pipeline must accept it"

