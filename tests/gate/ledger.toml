# The ledger of the diff gate (docs/plan/core-ir.md, section 2.5).
#
# Each entry accepts a group of programs of one class. The gate reads this file
# at each run. An entry that matches no program gives a warning.
#
# [[entry]]
# class = "lost-clean"   # open, edge, open-old, new-fp, lost-clean, moved, changed or engine
# files = ["tests/gate/probes/r2/oracle/fp/v069_part.wf"]   # paths or globs
# finding = "V069"       # the finding id (open: a finding whose verdict is "stays")
# verdict = "stays"      # open only: the verdict of the finding in docs/ir.md section 10
# issue = 12             # edge: the issue number; new-fp with reason_class "precision"
# reason_class = "stricter"   # new-fp only: "stricter" (a rule of the ADR) or "precision"
# codes = ["W0301"]      # moved and changed only: the codes that the entry accepts
# reason = "STATE: the holder of the part rebinds at the new value"
# signed_by = "review agent, stage F8"   # lost-clean: a reviewer, not the author
# stage = "F8"
#
# [[entry]]               # stage I5: a difference of the engine differential
# class = "engine"        # (`weft-gate engines`, crates/weft-gate/src/engines.rs)
# difference = "capture"  # the class of the difference (engines::Kind); its shape
#                         # must hold for the difference
# checker = "rejects"     # optional: a rule for each program that the checker
#                         # rejects. With no `checker`, `files` names each
#                         # program (no glob): a difference on a program that
#                         # the checker accepts needs such an entry
# files = ["**"]
# reason = "rule CAPTURE: a borrowed capture is ByRef"
# stage = "I5"
#
# For each difference, the engine differential takes the first engine entry
# (in the order of this file) whose files match the program, whose `checker`
# holds, and whose class has the shape of the difference.

# Stage G6: the `open` programs of tier 1 with the old pipeline. The old
# pipeline accepts each program, and the `ast` oracle faults on it. Each group
# has one fault kind and one shape. The finding id comes from the file name,
# from `docs/ir.md` section 10 or from
# `docs/plan/core-ir-inputs/root_causes.md`. The ids `sem-N1` to `sem-N4` are
# the findings N1 to N4 of `docs/plan/core-ir-inputs/semantics.md`; `map-N1`
# and `map-N2` are N1 and N2 of `docs/plan/core-ir-inputs/map_lowering.md`
# (`docs/ir.md` section 10.2 has both lists).

